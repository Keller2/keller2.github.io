<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZSRFD8Q0ZC"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZSRFD8Q0ZC');

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Ben Keller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --neon: #39ff14;
      --neon-glow: rgba(57, 255, 20, 0.28);
      --bg: #080808;
      --bg-card: #0f0f0f;
      --border: #1e1e1e;
      --text: #e2e2e2;
      --text-muted: #666;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      height: 64px;
      border-bottom: 1px solid var(--border);
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .header-logo img {
      width: 30px;
      height: 30px;
      opacity: 0.85;
    }

    .header-back {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }

    .header-back:hover { color: var(--text); }

    /* Page */
    .page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - 64px);
      padding: 48px 24px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 44px 48px;
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      resize: vertical;
    }

    input:focus, textarea:focus {
      border-color: var(--neon);
      box-shadow: 0 0 0 3px rgba(57, 255, 20, 0.08);
    }

    textarea { min-height: 120px; }

    .submit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
      padding: 14px;
      background: var(--neon);
      color: #080808;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
    }

    .submit-btn:hover {
      background: #5eff2e;
      box-shadow: 0 0 24px var(--neon-glow);
      transform: translateY(-2px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .success-msg {
      display: none;
      text-align: center;
      padding: 16px;
      background: rgba(57, 255, 20, 0.07);
      border: 1px solid rgba(57, 255, 20, 0.25);
      border-radius: 8px;
      color: var(--neon);
      font-size: 0.9rem;
      font-weight: 500;
      margin-top: 16px;
    }

    @media (max-width: 600px) {
      .header { padding: 0 20px; }
      .card { padding: 32px 24px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="header-logo">
      <img src="images/1.png" alt="BK">
      Ben Keller
    </a>
    <a href="index.html" class="header-back">
      ← Back
    </a>
  </header>

  <main class="page">
    <div class="card">
      <h1>Get In Touch</h1>
      <p class="subtitle">Have an opportunity, question, or just want to say hi? Send me a message and I'll get back to you.</p>

      <form id="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="What's on your mind?" required></textarea>
        </div>
        <button type="submit" class="submit-btn">
          Send Message
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <div class="success-msg" id="success-msg">Message sent! I'll be in touch soon.</div>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('contact-form').addEventListener('submit', function(e) {
      e.preventDefault();
      // TODO: wire up to a form backend (Formspree, EmailJS, etc.)
      document.getElementById('success-msg').style.display = 'block';
      this.querySelectorAll('input, textarea, button').forEach(el => el.disabled = true);
    });
  </script>

</body>
</html>
